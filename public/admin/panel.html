<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Painel — Vindicatus</title>
  <link rel="stylesheet" href="css/admin.css"/>
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
  <header class="top">
    <h1>Painel</h1>
    <div class="row">
      <button id="logout">Sair</button>
    </div>
  </header>

  <!-- Toast -->
  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <main class="wrap">
    <section class="card">
      <h2>Meu perfil</h2>

      <div class="grid2">
        <div>
          <label>Nome</label>
          <input id="meName" placeholder="Seu nome" />
        </div>

        <div>
          <label>Foto (upload)</label>
          <input id="mePhotoFile" type="file" />
          <div class="muted small" id="mePhotoUrl"></div>
        </div>
      </div>

      <div class="row">
        <button id="saveMe">Salvar</button>
      </div>
      <p class="muted small" id="meInfo"></p>
    </section>

    <section class="card">
      <h2>Nova postagem — Expostos</h2>

      <div class="grid2">
        <div>
          <label>Título</label>
          <input id="title" placeholder="Título da postagem" />
        </div>
        <div></div>
      </div>

      <div class="grid2">
        <div>
          <label>Capa (upload)</label>
          <input id="coverFile" type="file" />
          <div class="muted small" id="coverUrl"></div>
        </div>
        <div>
          <label>Galeria (upload múltiplo)</label>
          <input id="galleryFiles" type="file" multiple />
          <div class="muted small" id="galleryCount"></div>
        </div>
      </div>

      <label>Conteúdo</label>
      <div id="editor" class="editor"></div>

      <div class="row">
        <button id="publish">Publicar</button>
        <button id="refresh">Recarregar lista</button>
      </div>

      <div class="err" id="err"></div>
    </section>

    <section class="card">
      <h2>Postagens — Expostos</h2>
      <div id="posts"></div>
    </section>

    <section class="card" id="curatorsCard" style="display:none;">
      <h2>Curadores (somente supremo)</h2>

      <div class="grid2">
        <div>
          <label>Novo curador — usuário</label>
          <input id="newUser" placeholder="ex: curador01" />
        </div>
        <div>
          <label>Senha do curador</label>
          <input id="newPass" type="password" placeholder="mínimo 8" />
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Nome exibido</label>
          <input id="newName" placeholder="Nome público" />
        </div>
        <div></div>
      </div>

      <div class="row">
        <button id="createCurator">Criar curador</button>
        <button id="reloadCurators">Recarregar</button>
      </div>

      <div class="muted small" id="curatorsHint"></div>
      <div id="curatorsList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
